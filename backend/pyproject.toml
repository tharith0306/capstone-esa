[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudshield"
version = "0.2.0"
description = "Cross-layer security event correlation and explainable risk scoring for AWS"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "hmmlearn>=0.3.2",
    "shap>=0.46",
    "networkx>=3.3",
    "joblib>=1.4",
    "alembic>=1.13",
    "PyJWT>=2.8",
    "lime>=0.2.0.1",
    "dice-ml>=0.11",
    "reportlab>=4.0",
    "celery[redis]>=5.4",
]

[project.optional-dependencies]
deep = ["torch>=2.3"]
graph = ["neo4j>=5.20"]

dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "moto[iam,ec2,s3,sqs,logs,cloudwatch,sts]>=5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.database.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
