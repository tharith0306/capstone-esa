[alembic]
script_location = app/database/migrations
# sqlalchemy.url is taken from CLOUDSHIELD_DATABASE_URL

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
