# To activate: git mv ci/github-actions.yml .github/workflows/ci.yml  (pushing workflow files needs a
# GitHub token with the `workflow` scope, e.g. `gh auth refresh -s workflow` or a PAT with that scope).
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install (CPU-only PyTorch for the sequence-model tests)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,deep,graph]"
      - name: Tests
        run: pytest -q -p no:warnings
      - name: Experiment smoke run
        run: python -m app.cli experiments --quick
        env:
          CLOUDSHIELD_REPORTS_DIR: /tmp/reports
          CLOUDSHIELD_LOG_LEVEL: WARNING

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
