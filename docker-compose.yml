services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Local development credentials only.
      POSTGRES_DB: cloudshield
      POSTGRES_USER: cloudshield
      POSTGRES_PASSWORD: cloudshield
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudshield -d cloudshield"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      CLOUDSHIELD_DATABASE_URL: postgresql+psycopg://cloudshield:cloudshield@postgres:5432/cloudshield
      CLOUDSHIELD_EVIDENCE_BACKEND: local
      CLOUDSHIELD_EVIDENCE_DIR: /data/evidence
      CLOUDSHIELD_AWS_REGION: ${CLOUDSHIELD_AWS_REGION:-ap-south-1}
      CLOUDSHIELD_AWS_PROFILE: ${CLOUDSHIELD_AWS_PROFILE:-}
    volumes:
      - evidence:/data/evidence
      - ${HOME}/.aws:/root/.aws:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  evidence:
